name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read at the workflow level, write only on the job that needs it — the same split release.yml
# already uses. A workflow-level `contents: write` is granted to EVERY job the file grows, and the
# grant would then arrive silently, attached to nothing anyone chose (zizmor's
# `excessive-permissions`, CI-137).
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # `mkdocs gh-deploy` pushes the built site to the `gh-pages` branch
    steps:
      # ⚠ NO `persist-credentials: false` HERE, unlike ci.yml. `mkdocs gh-deploy` (below) shells
      # out to `git push origin gh-pages` through ghp-import, and `origin`'s only credential IS the
      # one checkout persists into `.git/config` — dropping it turns the deploy into a 403. The
      # workflow-level `contents: write` above exists for exactly that push.
      #
      # zizmor's `artipacked` flags the persistence at Low confidence; its threat model is a
      # credential escaping through an uploaded workspace, and this job uploads no artifact (its
      # output goes to the `gh-pages` branch). Suppressed per-site rather than by config, so the
      # reason travels with the line.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked]

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync docs dependencies
        run: uv sync --group docs

      - name: Build and deploy docs
        run: uv run mkdocs gh-deploy --force
