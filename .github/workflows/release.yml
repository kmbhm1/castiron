# ---------------------------------------------------------------------------
# Release — python-semantic-release → GitHub Release → PyPI (trusted publish).
#
# GATED ON PURPOSE. While castiron is pre-alpha this runs only via manual
# `workflow_dispatch`, so a work-in-progress never publishes itself. When you
# are ready to start cutting automatic releases on merge to main:
#
#   1. Add the trigger:            on: push: branches: [main]
#   2. Configure PyPI Trusted Publishing for the `cast-iron` project (the PyPI
#      distribution name; the import package and this repo stay `castiron`) pointing at
#      this workflow (no API token needed — uses OIDC id-token below).
#
# THE GITHUB APP IS OPTIONAL, and unset today. Its only job is pushing the version
# bump past branch protection — and this repo has none, nor can it: branch protection
# is a paid feature on a private repo (the API returns 403 "Upgrade to GitHub Pro or
# make this repository public"). `main` is therefore unprotected, and the job's own
# `contents: write` GITHUB_TOKEN can push the version-bump commit + tag by itself.
# So the App step is conditional on `vars.VERSION_BUMPER_APPID` being set, and every
# token use site falls back to `github.token` when it is skipped.
#
# It stops being optional the moment `main` gets branch protection — free as soon as
# this repo goes public. Then, with no edit to this file: create a GitHub App with
# contents:write, install it here, and set BOTH the repo variable VERSION_BUMPER_APPID
# and the secret VERSION_BUMPER_SECRET. (Set only the variable and the App step will
# run and fail on the missing key — a deliberate loud failure, not a silent downgrade
# to a token that cannot push.)
#
# Caveat of the GITHUB_TOKEN path: a push made with GITHUB_TOKEN does not trigger
# other workflows, so the version-bump commit does not re-run `docs.yml` (push: main).
# The merge that preceded it already did.
#
# Until then, run it by hand from the Actions tab to cut the first release.
# ---------------------------------------------------------------------------
# REHEARSAL MODE (CI-123) -- tick `rehearse` on a manual dispatch.
#
# WHY IT EXISTS. Two steps in this file have NEVER EXECUTED: `Publish to PyPI` and
# `Upload artifacts to the GitHub Release`. Both are gated on `released == 'true'`, and
# both release runs so far died upstream of them -- CI-121 in `build_command`, CI-122 at
# `github.create_release` (a 422: the rendered body was 169,012 chars against a 125,000
# cap). A third failure at the PUBLISH step would land after the version bump, the tag
# and the GitHub Release already exist -- straight back into the half-state the last two
# sessions were spent unwinding. So the publish is rehearsed first, against test.pypi.org,
# where a mistake costs nothing but a name in a sandbox index.
#
# WHAT A GREEN REHEARSAL PROVES
#   1. The OIDC exchange works FOR THIS WORKFLOW: the token minted by job `release` of
#      `.github/workflows/release.yml`, with `id-token: write` and no `environment:`, is
#      accepted by a Trusted Publisher. Same shape the real release emits; only the index,
#      and therefore the audience, differs (the action reads the audience from
#      `https://{domain}/_/oidc/audience`, so nothing is hand-configured).
#   2. A brand-new project name is claimable by a PENDING publisher's first upload, and the
#      pending -> concrete conversion works end to end.
#   3. Warehouse accepts our metadata -- long-description rendering, the PEP 639
#      `license` + `license-files` pair, classifiers, `Requires-Python`, and the
#      `Requires-Dist: uv~=0.11.32; extra == "build"` marker. `twine check` passed locally
#      on the real 0.1.0 artifacts and is NOT Warehouse's validator; this is.
#
# WHAT IT CANNOT PROVE -- read this before trusting a green run
#   * Nothing about the pypi.org pending publisher. That is a different row in a different
#     database on a different service; no query from this repository can read it. A green
#     rehearsal followed by `invalid-publisher` on pypi.org is a fully consistent outcome.
#   * Nothing about `cast-iron` being claimable on PyPI. TestPyPI has its own name state
#     and its own prohibited-name table (see NAME-D1 for why the hyphen matters).
#   * Nothing about python-semantic-release: rehearsal mode does not start it AT ALL. The
#     version bump, the changelog render, the tag push and `create_release` -- the step
#     CI-122 fixed -- are all still unexecuted, as is `publish-action`.
#   * Nothing about `build_command` inside PSR's container: the rehearsal builds on the
#     runner, with pipx, deliberately. Run 2 got past the container build, so that half is
#     proven by execution already.
#   * It cannot exercise the CI-121 channel at all, because it never starts the container
#     action. The `unset VIRTUAL_ENV` belt in `build_command` stays load-bearing.
#   * Job-level `permissions:` cannot be made mode-dependent, so `contents: write` is
#     granted during a rehearsal even though nothing writes. Stated, not fixed: splitting
#     the job to narrow it would add a second workflow-shaped surface for no safety gain.
#
# WHY AN INPUT AND NOT A SECOND WORKFLOW FILE. A PyPI Trusted Publisher match includes the
# WORKFLOW FILENAME: `job_workflow_ref` is one of warehouse's
# `__required_verifiable_claims__` for a GitHub publisher, `_check_job_workflow_ref` expects
# `OWNER/REPO/.github/workflows/WORKFLOW.yml@REF`, and the publisher row stores a
# `workflow_filename`. (Do not grep for `workflow_ref` and conclude otherwise -- that one is
# in `__unchecked_claims__`.) A `release-rehearsal.yml` would mint a claim castiron never
# ships and would validate nothing about the real one. One file, one job, one input.
#
# ⚠ USE `inputs.rehearse`, NEVER `github.event.inputs.rehearse`. GitHub: "the `inputs`
# context preserves Boolean values as Booleans instead of converting them to strings." The
# falsy set is `false, 0, -0, "", '', null` -- the STRING `'false'` is not on it. So the
# `github.event.inputs` spelling is ALWAYS truthy, and comparing it `== true` is ALWAYS
# false. Both silently invert a mode, in opposite directions.
#
# ⚠ EVERY NEGATION CARRIES `${{ }}`. A bare `if: !inputs.rehearse` is not a condition, it is
# a YAML TAG -- measured: `ConstructorError: could not determine a constructor for the tag
# '!inputs.rehearse'`. Always write `if: ${{ !inputs.rehearse }}`.
#
# THE DAY THE TRIGGER BECOMES `push: main`: under a push event the `inputs` context is
# empty, so `inputs.rehearse` dereferences to null -- falsy. `${{ !inputs.rehearse }}` is
# then true (the real path runs) and `${{ inputs.rehearse }}` is false (the rehearsal steps
# skip). That is correct by design, not by luck; do not "fix" it when you flip the switch.
#
# All of the above is enforced by `tests/unit/test_repo_tooling.py`
# (`TestTheRehearsalCannotFireOnARealRelease`), because a workflow YAML change cannot be
# checked by running it.
# ---------------------------------------------------------------------------
name: release

on:
  workflow_dispatch:
    inputs:
      rehearse:
        # ⚠ `default: false` is load-bearing. A `true` default would turn the plain
        # "Run workflow" -- the way the first release gets cut -- into a TestPyPI upload
        # that reports success and releases nothing. `type: boolean` is what makes
        # `inputs.rehearse` a real boolean rather than the string trap above.
        description: 'Rehearse against TestPyPI: skip semantic-release entirely (no bump, no commit, no tag, no GitHub Release), build the in-tree version and upload to test.pypi.org. Leave UNCHECKED to cut a real release.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
      contents: write   # push the version-bump commit + tag
    steps:
      - name: Create GitHub App token
        id: app-token
        if: vars.VERSION_BUMPER_APPID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      # ⚠ NOTHING uv-SHAPED BELONGS ON THE RUNNER IN THIS JOB. Two steps used to sit here --
      # `astral-sh/setup-uv@v5` with `python-version: '3.12'`, then `uv sync --group dev` -- and
      # together they are what killed the 0.1.0 release run (CI-121).
      #
      # `setup-uv` does more than put uv on PATH. Given a `python-version` input it runs
      # `uv venv --python <ver>` (creating the workspace `.venv` itself, BEFORE any `uv sync`),
      # prepends `.venv/bin` to PATH, and exports `VIRTUAL_ENV` via `core.exportVariable` --
      # i.e. through `$GITHUB_ENV`, which makes it JOB-SCOPED and inherits into every later step.
      # The next step is a Docker container action; the runner translates that value to the
      # container path, so `build_command` ran with `VIRTUAL_ENV=/github/workspace/.venv` pointing
      # at a venv whose interpreter symlink resolves only on the runner. Inside the image it is a
      # broken symlink, and uv treats a broken ACTIVE environment as fatal:
      #
      #   error: Failed to build `/github/workspace`
      #     Caused by: Failed to inspect Python interpreter from active virtual environment ...
      #
      # Measured, in the PSR action's own base image: broken `.venv` + `VIRTUAL_ENV` naming it =>
      # exit 2, no distributions. The SAME broken `.venv` with `VIRTUAL_ENV` unset => exit 0, two
      # distributions. So the variable, not the directory, is the mechanism -- `uv lock` only warns
      # about a broken venv it merely discovers.
      #
      # Deleting only `uv sync --group dev` would NOT have fixed this: `setup-uv` is what creates
      # the `.venv` and exports the variable. Both steps go, because nothing here consumes either.
      # The release job has no `run:` steps; PSR runs in its own container and `build_command`
      # installs its own dependencies from the `build` extra; `create-github-app-token` is node20;
      # and `gh-action-pypi-publish` discovers a Python on the runner and INSTALLS one if it finds
      # none, so it cannot be stranded by the absence of a venv (it is better off -- it no longer
      # discovers the project venv's interpreter ahead of the system one).
      #
      # `build_command` also defends itself with `unset VIRTUAL_ENV` (see pyproject.toml). That is
      # the belt to this brace, not a duplicate: PSR passes a fixed whitelist rather than the
      # environment, and `VIRTUAL_ENV` is the ONLY name on it that anything on the runner can set.
      #
      # ⚠ THE `!inputs.rehearse` CONJUNCT ON THE NEXT THREE STEPS IS DEFENCE IN DEPTH, AND IT
      # STAYS. On the two publish steps it is strictly redundant -- a skipped step produces no
      # outputs, so with the version step below skipped `steps.release.outputs.released` is the
      # empty string and `== 'true'` is already false. It is written out anyway because it makes
      # "no step is reachable in the wrong mode" a property OF THE FILE rather than a property of
      # a chain of reasoning about skipped-step outputs, and because it is what the guard in
      # `tests/unit/test_repo_tooling.py` asserts. A future edit to either gate must still trip
      # over the negation. Do not simplify it back out.
      - name: Python Semantic Release (version + changelog + tag)
        id: release
        if: ${{ !inputs.rehearse }}
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ steps.app-token.outputs.token || github.token }}

      # ⚠ NO `repository-url` HERE, DELIBERATELY -- unset IS real PyPI. The canonical kebab-case
      # input carries no default; the deprecated `repository_url` alias defaults to
      # `https://upload.pypi.org/legacy/`, and the composite passes
      # `${{ inputs.repository-url || inputs.repository_url }}`. So any value on this step
      # silently redirects a REAL release to some other index -- a release that reports success
      # and publishes nothing anyone can install. The guard asserts both spellings are absent.
      - name: Publish to PyPI
        if: ${{ !inputs.rehearse && steps.release.outputs.released == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

      # `publish-action`, NOT `upload-to-gh-release`. The latter is archived+deprecated
      # upstream (last release v9.8.9, Sept 2024) and — the reason this was a live
      # first-release failure — publishes NO floating major tag, so the `@v9` that works
      # for the `python-semantic-release` action two steps above resolves to nothing here.
      # A `uses:` ref that does not resolve fails the job, and this step is gated on
      # `released == 'true'`, so it could only ever have fired on the first real release.
      # `publish-action` does publish `v9`, takes the same inputs, and is what the pinned
      # v9.21.2 docs prescribe. Keep its major in lockstep with the version step (CI-116).
      - name: Upload artifacts to the GitHub Release
        if: ${{ !inputs.rehearse && steps.release.outputs.released == 'true' }}
        uses: python-semantic-release/publish-action@v9
        with:
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          tag: ${{ steps.release.outputs.tag }}

      # --- rehearsal only, from here down (CI-123) -------------------------------------------
      #
      # ⚠ PIPX, NOT `astral-sh/setup-uv` -- AND NOT EVEN A GATED ONE. See the block above: that
      # action creates the workspace `.venv` and exports `VIRTUAL_ENV` through `$GITHUB_ENV`,
      # which is JOB-scoped and reaches the container action. `if: ${{ inputs.rehearse }}` would
      # keep it off the real path today, which is exactly why the reasoning has to live here and
      # the guard has to be structural: `if:` conditions get edited. The invariant asserted in
      # `tests/unit/test_repo_tooling.py` is not "no ungated setup-uv" -- it is "no setup-uv, and
      # nothing writing `$GITHUB_ENV`, ANYWHERE in this file". A plain `run:` step writes nothing
      # to `$GITHUB_ENV` unless its command does.
      #
      # The uv pin is byte-equal to `[project.optional-dependencies].build` in pyproject.toml, and
      # the guard binds them: that pin tracks THE uv THAT WROTE `uv.lock`, and a second,
      # independently drifting declaration of "the uv this project releases with" is the thing to
      # avoid. The rehearsal does not rewrite the lock, so it does not need that property -- it
      # just must not contradict it.
      #
      # pipx ships on the runner image (`Pipx 1.16.0` on ubuntu-24.04, which `ubuntu-latest`
      # currently resolves to; the 26.04 preview carries 1.16.1). If that ever stops being true
      # the step fails loudly with `pipx: command not found` IN A REHEARSAL, never on the real
      # path -- a cost of one re-dispatch, paid in the mode that exists to absorb it.
      - name: Build the distributions (rehearsal only)
        if: ${{ inputs.rehearse }}
        run: pipx run --spec 'uv~=0.11.32' uv build

      # ⚠ NO `skip-existing`, BY CAPTAIN RULING (CI-123-Q2). TestPyPI is permanent per
      # `(name, version)`, so `cast-iron 0.0.0` can be uploaded exactly once and a second
      # rehearsal MUST fail loudly on "File already exists". With `skip-existing: true` a
      # successful rehearsal and a rehearsal that silently uploaded NOTHING become
      # indistinguishable -- the false-green class this project keeps getting bitten by. The
      # guard asserts the input is absent so a later "convenience" addition trips a test.
      - name: Publish to TestPyPI (rehearsal only)
        if: ${{ inputs.rehearse }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true
