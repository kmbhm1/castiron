# ---------------------------------------------------------------------------
# Release — python-semantic-release → GitHub Release → PyPI (trusted publish).
#
# GATED ON PURPOSE. While castiron is pre-alpha this runs only via manual
# `workflow_dispatch`, so a work-in-progress never publishes itself. When you
# are ready to start cutting automatic releases on merge to main:
#
#   1. Add the trigger:            on: push: branches: [main]
#   2. Configure PyPI Trusted Publishing for the `cast-iron` project (the PyPI
#      distribution name; the import package and this repo stay `castiron`) pointing at
#      this workflow (no API token needed — uses OIDC id-token below).
#
# THE GITHUB APP IS OPTIONAL, and unset today. Its only job is pushing the version
# bump past branch protection — and this repo has none, nor can it: branch protection
# is a paid feature on a private repo (the API returns 403 "Upgrade to GitHub Pro or
# make this repository public"). `main` is therefore unprotected, and the job's own
# `contents: write` GITHUB_TOKEN can push the version-bump commit + tag by itself.
# So the App step is conditional on `vars.VERSION_BUMPER_APPID` being set, and every
# token use site falls back to `github.token` when it is skipped.
#
# It stops being optional the moment `main` gets branch protection — free as soon as
# this repo goes public. Then, with no edit to this file: create a GitHub App with
# contents:write, install it here, and set BOTH the repo variable VERSION_BUMPER_APPID
# and the secret VERSION_BUMPER_SECRET. (Set only the variable and the App step will
# run and fail on the missing key — a deliberate loud failure, not a silent downgrade
# to a token that cannot push.)
#
# Caveat of the GITHUB_TOKEN path: a push made with GITHUB_TOKEN does not trigger
# other workflows, so the version-bump commit does not re-run `docs.yml` (push: main).
# The merge that preceded it already did.
#
# Until then, run it by hand from the Actions tab to cut the first release.
# ---------------------------------------------------------------------------
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
      contents: write   # push the version-bump commit + tag
    steps:
      # `permission-contents: write` narrows the App token to what this job actually does, which
      # the header comment above already states in prose: push the version-bump commit + tag, and
      # create the GitHub Release with its assets (all of which live under `contents`). Without a
      # `permission-*` input the minted token inherits the App's FULL installation permissions —
      # zizmor's `github-app` audit, and the reason it is High confidence: an installation grows
      # scopes over time and the token silently grows with it. Inert today (the step is skipped
      # while `vars.VERSION_BUMPER_APPID` is unset), which is exactly when it is cheap to set.
      - name: Create GitHub App token
        id: app-token
        if: vars.VERSION_BUMPER_APPID != ''
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}
          permission-contents: write

      # ⚠ NO `persist-credentials: false` HERE, unlike ci.yml — and this one is a JUDGEMENT CALL,
      # not a constraint. Measured at the pinned refs, no step in this job consumes the credential
      # checkout persists: `python-semantic-release@v9` does `export GH_TOKEN="$INPUT_GITHUB_TOKEN"`
      # (action.sh) and pushes to `hvcs_client.remote_url(use_token=True)` — an explicitly
      # tokenized URL, not `origin` (cli/commands/version.py:684 of 9.21.2); `publish-action@v9`
      # exports the same variable and only calls the API; `gh-action-pypi-publish` uses OIDC. So
      # the flag would very probably be safe.
      #
      # It is still not taken, because it buys nothing HERE and the downside is uncapped:
      # `artipacked` is a Low-confidence audit whose threat model is a credential escaping through
      # an uploaded workspace, and this job uploads `dist/` — never the workspace — to PyPI and to
      # the GitHub Release. Against that, this is the one path in the repo that cannot be exercised
      # without publishing: a wrong guess lands AFTER the version bump and the tag push, which is
      # how CI-115 and CI-121 both failed. Suppressed per-site so the reasoning travels with it.
      #
      # Flipping it is a one-line captain decision; re-read the measurement above first, and note
      # it must be re-taken if a step is ever added that archives the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      # ⚠ NOTHING uv-SHAPED BELONGS ON THE RUNNER IN THIS JOB. Two steps used to sit here --
      # `astral-sh/setup-uv@v5` with `python-version: '3.12'`, then `uv sync --group dev` -- and
      # together they are what killed the 0.1.0 release run (CI-121).
      #
      # `setup-uv` does more than put uv on PATH. Given a `python-version` input it runs
      # `uv venv --python <ver>` (creating the workspace `.venv` itself, BEFORE any `uv sync`),
      # prepends `.venv/bin` to PATH, and exports `VIRTUAL_ENV` via `core.exportVariable` --
      # i.e. through `$GITHUB_ENV`, which makes it JOB-SCOPED and inherits into every later step.
      # The next step is a Docker container action; the runner translates that value to the
      # container path, so `build_command` ran with `VIRTUAL_ENV=/github/workspace/.venv` pointing
      # at a venv whose interpreter symlink resolves only on the runner. Inside the image it is a
      # broken symlink, and uv treats a broken ACTIVE environment as fatal:
      #
      #   error: Failed to build `/github/workspace`
      #     Caused by: Failed to inspect Python interpreter from active virtual environment ...
      #
      # Measured, in the PSR action's own base image: broken `.venv` + `VIRTUAL_ENV` naming it =>
      # exit 2, no distributions. The SAME broken `.venv` with `VIRTUAL_ENV` unset => exit 0, two
      # distributions. So the variable, not the directory, is the mechanism -- `uv lock` only warns
      # about a broken venv it merely discovers.
      #
      # Deleting only `uv sync --group dev` would NOT have fixed this: `setup-uv` is what creates
      # the `.venv` and exports the variable. Both steps go, because nothing here consumes either.
      # The release job has no `run:` steps; PSR runs in its own container and `build_command`
      # installs its own dependencies from the `build` extra; `create-github-app-token` is node20;
      # and `gh-action-pypi-publish` discovers a Python on the runner and INSTALLS one if it finds
      # none, so it cannot be stranded by the absence of a venv (it is better off -- it no longer
      # discovers the project venv's interpreter ahead of the system one).
      #
      # `build_command` also defends itself with `unset VIRTUAL_ENV` (see pyproject.toml). That is
      # the belt to this brace, not a duplicate: PSR passes a fixed whitelist rather than the
      # environment, and `VIRTUAL_ENV` is the ONLY name on it that anything on the runner can set.
      #
      # ⚠ `@v9`, NOT A SHA -- one of the only two refs in this repo that CI-143 deliberately left
      # unpinned, because this major is READ as configuration rather than merely resolved.
      # `tests/unit/test_repo_tooling.py::TestTheReleaseBuildCommandCanRunWhereItRuns::
      # test_every_variable_the_command_reads_is_one_the_pinned_psr_major_provides` parses this
      # line for its major and uses it to decide which variables `build_command` may reference --
      # v9 injects `NEW_VERSION` alone, `PACKAGE_NAME` arrived in v10, and under v9 that name
      # expands to empty and `uv lock --upgrade-package ""` aborts the release AFTER the version
      # bump and the tag push (CI-115). A SHA carries no readable major, and the only way to green
      # that guard under one would be to read the major out of a trailing `# vX.Y.Z` comment: an
      # answer taken from prose nothing verifies, on the one path that cannot be tested by running
      # it. The exemption and this reasoning are recorded in `.github/zizmor.yml`.
      - name: Python Semantic Release (version + changelog + tag)
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ steps.app-token.outputs.token || github.token }}

      # ⚠ NO `repository-url` HERE, DELIBERATELY -- unset IS real PyPI. The canonical kebab-case
      # input carries no default; the deprecated `repository_url` alias defaults to
      # `https://upload.pypi.org/legacy/`, and the composite passes
      # `${{ inputs.repository-url || inputs.repository_url }}`. So any value on this step
      # silently redirects a REAL release to some other index -- a release that reports success
      # and publishes nothing anyone can install. The guard asserts both spellings are absent.
      #
      # ⚠ The ref moved from `@release/v1` to a commit SHA (CI-143), and the swap was MEASURED to be
      # a no-op rather than assumed: `refs/heads/release/v1` and the tag `v1.14.2` resolve to the
      # same commit, so this step runs byte-identical action code either way. Upstream prescribes
      # the branch, and that recommendation is about staying current -- which `.github/dependabot.yml`
      # now does explicitly, through a PR a human merges, instead of silently between two runs of a
      # workflow nobody can rehearse.
      - name: Publish to PyPI
        if: ${{ steps.release.outputs.released == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true

      # `publish-action`, NOT `upload-to-gh-release`. The latter is archived+deprecated
      # upstream (last release v9.8.9, Sept 2024) and — the reason this was a live
      # first-release failure — publishes NO floating major tag, so the `@v9` that works
      # for the `python-semantic-release` action two steps above resolves to nothing here.
      # A `uses:` ref that does not resolve fails the job, and this step is gated on
      # `released == 'true'`, so it could only ever have fired on the first real release.
      # `publish-action` does publish `v9`, takes the same inputs, and is what the pinned
      # v9.21.2 docs prescribe. Keep its major in lockstep with the version step (CI-116) -- which
      # is also why this is the second ref CI-143 left unpinned: "same major as the step above" is
      # a comparison two SHAs cannot express.
      - name: Upload artifacts to the GitHub Release
        if: ${{ steps.release.outputs.released == 'true' }}
        uses: python-semantic-release/publish-action@v9
        with:
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          tag: ${{ steps.release.outputs.tag }}
