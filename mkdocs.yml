site_name: castiron
site_description: A schema→typed-code compiler for Python.
site_url: https://kmbhm1.github.io/castiron/
repo_url: https://github.com/kmbhm1/castiron
repo_name: kmbhm1/castiron
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

# Broken cross-references are a docs bug, so `mkdocs build --strict` should fail on them.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  # Generates the CLI reference from the click command itself, so `castiron gen --help`
  # and docs/reference/cli.md can never disagree.
  - mkdocs-click
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
  - Sources:
      - OpenAPI / PostgREST: sources/openapi.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Environment variables: reference/environment-variables.md
      - Exit codes: reference/exit-codes.md
