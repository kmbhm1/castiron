[project]
# ⚠ The DISTRIBUTION name only. The import package, the console script and the repository stay
# `castiron` -- PyPI carries an admin `ProhibitedProjectName` row for the unhyphenated spelling,
# and its normalization never inserts or removes a separator, so `cast-iron` is a different
# blocklist key. A hyphenated dist over an unhyphenated import is thoroughly idiomatic
# (python-dateutil/dateutil, scikit-learn/sklearn). See NAME-D1.
name = "cast-iron"
version = "0.3.0"
description = "A schema→typed-code compiler for Python — typed models and a typed client from your schema, with drift-check in CI."
authors = [{ name = "Kevin Boehm", email = "kmbhm1@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = [
    "schema",
    "codegen",
    "compiler",
    "pydantic",
    "sqlalchemy",
    "supabase",
    "postgres",
    "openapi",
    "typed",
    "drift",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.7",
    "inflection>=0.5.1",
    "pydantic>=2.13.4",
    # tomllib is stdlib from 3.11; the 3.10 leg needs a parser to read [tool.castiron].
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# ⚠ BUILD-ONLY. This must never become a runtime dependency — castiron's near-zero-runtime-
# dependency posture is deliberate. It cannot leak: extras are opt-in, so `pip install cast-iron`
# does not install this; only `pip install 'cast-iron[build]'` does. Asserted against the built
# wheel's own METADATA by `tests/unit/test_repo_tooling.py` (the marker `; extra == "build"` is
# what makes it inert for a normal install).
#
# It has exactly ONE consumer: `[tool.semantic_release].build_command` below. That command runs
# inside the PSR GitHub Action's own Docker image — `FROM python:3.13-bookworm`, verified at the
# commit `@v9` resolves to (v9.21.2) — which has no `uv` and cannot see the host's, because
# `astral-sh/setup-uv` installs onto the runner, not into the container. So the release build has
# to install its own uv, and this is where that uv's version is declared.
#
# THE PIN TRACKS THE uv THAT WROTE `uv.lock` (0.11.x — `version = 1`, `revision = 3`), not the
# newest uv. The release build is the one place a lock rewrite is COMMITTED and PUBLISHED, so it
# is the one place worth pinning; CI's unpinned `astral-sh/setup-uv` only ever *reads* the lock.
# `>=0.11.32` floors it at the version developers actually run, `==0.11.*` refuses a resolver
# minor nobody has locked against. Measured today: uv 0.12.1 leaves this lock byte-identical, so
# the ceiling costs nothing now — it is insurance against the lock-format `revision` bump uv has
# shipped in minor releases before. Move this pin when the developer toolchain moves.
build = ["uv~=0.11.32"]

[project.urls]
Homepage = "https://github.com/kmbhm1/castiron"
Repository = "https://github.com/kmbhm1/castiron"
Issues = "https://github.com/kmbhm1/castiron/issues"

[project.scripts]
castiron = "castiron.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "vulture>=2.14",
    "python-semantic-release>=9.8.5",
    "pre-commit>=3.7.1",
    "commitizen>=3.28.0",
    # Unconditional in dev so mypy sees real tomli types on the 3.11+ interpreters too:
    # [tool.mypy] pins python_version = "3.10", so mypy always analyses the
    # `import tomli as tomllib` branch of the version gate in castiron/cli/config.py --
    # without tomli installed it would degrade to Any and stop typechecking that module's
    # TOML calls.
    "tomli>=2.0.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.30",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-click>=0.8.1",
    "pymdown-extensions>=10.16.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ⚠ LOAD-BEARING, do not remove. Without this pin hatchling infers the package directory from
# [project].name -- which is `cast-iron` -- looks for `src/cast_iron`, finds nothing, and builds
# an EMPTY wheel that passes every other gate in this repo and only surfaces on a user's
# `pip install`.
packages = ["src/castiron"]

# ----------------------------------------------------------------------------
# House style — ruff (single quotes, 120 cols, Google docstrings, py310 target)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
extend-exclude = ["docs", "dist", "build", ".venv"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP", # pyupgrade
    "D",  # pydocstyle
    "I",  # isort
    "Q",  # flake8-quotes
    "W",  # pycodestyle warnings
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"] # tests need no docstrings

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ----------------------------------------------------------------------------
# Typing is the contract — mypy strict over src/
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
files = ["src"]

# ----------------------------------------------------------------------------
# Dead-code detection (CI-107)
# ----------------------------------------------------------------------------
# ⚠ Before this section existed, `uv run vulture src/` -- named as castiron's dead-code check in
# CLAUDE.md and provided as `make vulture` -- could not pass: it exited 3 (vulture's `DeadCode`,
# i.e. it ran fine and found something; 2 would have meant the command itself was malformed) with
# 22 findings, ALL at 60% confidence, and every one of them a false positive. A documented quality
# check that can never go green teaches its readers to stop running it.
#
# Why vulture is wrong about all 22, in four independent ways it cannot see:
#
#   * REFLECTIVE READS  -- `Schema.as_dict()` serializes via `{f.name: ... for f in fields(obj)}`,
#                          so EVERY IR dataclass field is consumed by name at runtime and by none
#                          at parse time. This is most of the list.
#   * THE STDLIB READS  -- `RedactingFilter.filter` assigns `record.msg` / `record.args` on a
#                          `logging.LogRecord`; `Formatter.format` reads them back. The consumer
#                          is CPython, not this repo.
#   * PUBLIC SURFACE    -- castiron is a published library. `castiron.ir`'s exported model methods
#                          and `castiron.cli.errors`' documented exit-code table are used by
#                          DOWNSTREAM code, which vulture will never see. "Unused in src/" is not
#                          "unused" for anything on the other side of a release.
#   * PORTED AHEAD      -- two supabase-pydantic fidelity helpers landed with the IR (CI-003)
#                          before the source that calls them (CI-010/013/020).
#
# All 22 are exercised by tests/ -- `uv run vulture src/ tests/` leaves exactly one of them
# standing -- so this list allowlists reachable, covered code, never anything unreferenced.
#
# `ignore_names` matches a BARE NAME everywhere, not a name at a location; that is the only
# location-independent knob vulture offers short of excluding whole files. So keep entries
# explicit (no globs) and delete one the moment its symbol goes -- a stale entry silently widens
# the blind spot. `TestTheVultureAllowlistIsMinimal` in tests/unit/test_repo_tooling.py fails on
# an entry that no longer names anything in src/.
#
# ⚠ Do NOT "fix" a future finding by raising `min_confidence` past 60: unused *functions*,
# *classes* and *attributes* are all reported at exactly 60%, so 61 would blind vulture to nearly
# everything it is here to catch and turn this check into decoration. Left at the default 0.
[tool.vulture]
ignore_names = [
    # cli/errors.py -- the documented exit-code table. `EXIT_INTERNAL` is used in src/ and so is
    # absent here; these four are the contract users script against. `EXIT_DRIFT` is explicitly
    # reserved for `castiron check` (CI-021) and is unused BY DESIGN until that row lands.
    "EXIT_OK",
    "EXIT_ERROR",
    "EXIT_USAGE",
    "EXIT_DRIFT",
    # cli/output.py -- `WriteResult.written` is set from `not dry_run` and read by callers of the
    # public result shape, not by castiron itself.
    "written",
    # ir/models.py -- IR dataclass fields, read reflectively by `Schema.as_dict()`. Each is flagged
    # twice (the field declaration, and the attribute write in ir/build.py); one entry covers both.
    "unique_partners",
    "user_defined_values",
    "non_nullable",
    "mode",
    "volatility",
    # ir/models.py -- public methods on exported IR classes (`TableInfo`, `Schema`), consumed by
    # downstream users today and by the SQLAlchemy/client emitters (CI-012/030/031) later.
    "aliasing_in_columns",
    "table_dependencies",
    "primary_is_composite",
    "has_unique_constraint",
    "as_dict",
    # ir/build.py -- a fidelity helper ported from supabase-pydantic with the IR, ahead of the
    # source that calls it. (`parse_constraint_definition_for_fk` sat here too until CI-084 gave
    # it a real reader: cli/notices.py parses a retained-but-unresolved FOREIGN KEY definition
    # with it to name the table the schema does not contain.)
    "get_alias",
    # utils/logging.py -- attributes of the stdlib `logging.LogRecord`, read back by
    # `logging.Formatter`. Never referenced again inside castiron, and never dead.
    "msg",
    "args",
]

# ----------------------------------------------------------------------------
# Tests + coverage (90% floor, enforced in CI on the 3.10–3.13 matrix)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
log_level = "INFO"
markers = [
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test (needs a live source)",
]

[tool.coverage.run]
source = ["src/castiron"]
omit = ["*/__init__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 90

# ----------------------------------------------------------------------------
# Releases are machine-owned — python-semantic-release drives the version bump,
# CHANGELOG, tag, and GitHub Release from Conventional Commit messages.
# NEVER hand-edit the version above or CHANGELOG.md.
# ----------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
allow_zero_version = true
major_on_zero = true
# ⚠ This runs in the PSR action's Docker image, NOT on the runner — `runs: {using: docker, image:
# Dockerfile}`, `FROM python:3.13-bookworm`. It has no `uv`, and the `uv` that
# `astral-sh/setup-uv` put on the runner is not mounted in. The former one-liner `uv build` was
# therefore `uv: command not found`, and PSR aborts the release on a failed build. It also left
# `uv.lock` — which pins `cast-iron` by version — stale inside the very commit that rewrites
# `[project].version`. Both are the shape python-semantic-release documents against itself in
# `configuration-guides/uv_integration.rst`; this is that recipe, with two deliberate deviations
# recorded below.
#
# `set -e` — NOT decoration, and NOT in the vendor's example. PSR runs this whole block as a
# single `sh -c` string (`shell()`, `cli/commands/version.py`), so without it only the LAST
# command's exit status is reported: a failed `uv lock` followed by a successful `uv build` would
# exit 0 and publish the stale lock this command exists to prevent — silently.
#
# `cast-iron` is spelled out where the vendor writes `"$PACKAGE_NAME"`. That variable does not
# exist in the PSR major this repo runs: v9 injects `NEW_VERSION` only (verified at v9.21.2,
# `version.py:638`; `PACKAGE_NAME` arrived in v10). Under v9 it would expand to empty and
# `uv lock --upgrade-package ""` is a hard error — swapping one guaranteed release failure for
# another. `tests/unit/test_repo_tooling.py` binds this literal to `[project].name` and allows
# `$PACKAGE_NAME` again the moment the action is pinned at v10+.
#
# `git add uv.lock` stages into the index PSR then commits with a bare `git commit -m` (no
# pathspec, `gitproject.py`), so the refreshed lock rides the version-bump commit. The action
# sets `safe.directory "*"` in the SYSTEM gitconfig, so this `git` call is not blocked by the
# container's root-vs-runner ownership mismatch.
#
# `unset VIRTUAL_ENV` is what CI-121 added, and it is the second line rather than the first
# because `set -e` has to stay first (see above). PSR does not pass `os.environ` to this command --
# it builds a fixed WHITELIST (`build_distributions()`, cli/commands/version.py) of `PATH`, `HOME`,
# `VIRTUAL_ENV`, the CI markers and `NEW_VERSION`. `VIRTUAL_ENV` is the only name on that list any
# runner-side step can set, and `astral-sh/setup-uv` set it: given a `python-version` input it runs
# `uv venv`, then exports `VIRTUAL_ENV` through `$GITHUB_ENV`, which is job-scoped and reaches this
# container action with the path translated to `/github/workspace/.venv`. That venv's interpreter
# symlink resolves only on the runner, so inside the image uv found a BROKEN ACTIVE environment and
# `uv build` failed hard -- aborting the 0.1.0 release after the version had already been computed.
#
# Measured in the PSR action's own base image, with the real command: broken `.venv` + that
# variable => exit 2, zero distributions; the same broken `.venv` with the variable unset => exit
# 0, two distributions. `rm -rf .venv` also measures green, and was rejected: it deletes a
# directory this job did not create, and it only works while the poison happens to be spelled
# `.venv` -- it would do nothing at all if `VIRTUAL_ENV` ever named some other path. `unset` names
# the mechanism instead of a symptom.
#
# It cannot itself abort the build: `unset` returns 0 on an already-unset variable, and that exact
# case (no `VIRTUAL_ENV`, no `.venv`) was executed under `set -e` -- it is the post-fix CI state,
# now that release.yml no longer installs uv on the runner at all.
build_command = """
    set -e
    unset VIRTUAL_ENV
    python -m pip install -e '.[build]'
    uv lock --upgrade-package cast-iron
    git add uv.lock
    uv build
"""
# `conventional` is the current spelling; `angular` is deprecated and removed in PSR v11. Renamed
# only because equivalence was MEASURED on this exact history, not assumed: under both the PSR
# the action runs (9.21.2) and the PSR `uv.lock` resolves (10.6.1), both spellings print `0.1.0`
# and generate a byte-identical 2437-line CHANGELOG. That mattered — `major_on_zero = true` with
# `allow_zero_version = true` means a misparse cuts 1.0.0 instead of 0.1.0.
commit_parser = "conventional"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
# `src/castiron/__init__.py:__version__` is an independent literal, and it is what
# `castiron --version` prints and what the outbound PostgREST User-Agent carries. Without this
# line the first release would leave both reporting 0.0.0 against a published 0.1.0.
version_variables = ["src/castiron/__init__.py:__version__"]

# ⚠ A FOURTH key was removed here (CI-119): a bare `changelog_file = "CHANGELOG.md"`, which sat
# directly under `[tool.semantic_release]` and was read by nobody. `changelog_file` is not a field
# of `RawConfig` at this level in EITHER PSR this repo touches -- measured, `'changelog_file' in
# RawConfig.model_fields` is False on both 9.21.2 (what the `@v9` action runs) and 10.6.1 (what
# `uv.lock` resolves) -- so the same `extra="ignore"` described below swallowed it. It is the
# CI-093 / CI-097 shape again: it reads like the line that names the changelog, next to
# `version_toml` and `version_variables`, which really are load-bearing.
#
# Deleted rather than relocated, because BOTH relocations are worse:
#   * `[tool.semantic_release.changelog].changelog_file` is real but DEPRECATED -- 9.21.2's own
#     field docstring reads "Deprecated! Moved to 'default_templates.changelog_file'" and a
#     `field_validator` logs "compatibility will break in v10" on every load. That trades a silent
#     no-op for a warning-emitting key already scheduled for removal.
#   * `[tool.semantic_release.changelog.default_templates].changelog_file` is the live spelling,
#     and its default is already `"CHANGELOG.md"` -- verbatim what this line said. Restating a
#     default is new config surface for zero behaviour, and it would have to thread past the
#     sub-table ordering hazard flagged below.
# Nothing changes either way: the effective value was, and remains, `CHANGELOG.md` -- which is the
# file v0.1.0 and v0.1.1 actually wrote with this key being ignored. Guarded by
# `tests/unit/test_repo_tooling.py`.

# ⚠ Three v7-era keys were removed here: `branch = "main"`, `upload_to_pypi = false`,
# `upload_to_release = true`. All three were DEAD — `RawConfig` declares no `model_config`, so
# pydantic's default `extra="ignore"` swallowed them without a word (grep for `upload_to_pypi`
# across PSR v9.21.2 and v10.6.1: zero hits; the only `branch` field is the `branches` table
# below). `upload_to_pypi = false` is the reason they are gone rather than merely stale: it READS
# like "this project does not publish to PyPI" and did not disable anything — the publish is the
# explicit `pypa/gh-action-pypi-publish` step in `.github/workflows/release.yml`. An inert key
# that reads load-bearing is the CI-093 / CI-097 trap. The live successor of `upload_to_release`
# is `[tool.semantic_release.publish].upload_to_vcs_release`, which already defaults to `true`,
# so removing it changes nothing. Guarded by `tests/unit/test_repo_tooling.py`.

# ⚠ THIS TABLE MUST STAY BELOW EVERY BARE KEY OF `[tool.semantic_release]` — a sub-table header
# ends the parent table in TOML, so moving it up silently reparents `commit_parser`, `tag_format`
# and friends into it, where nothing reads them. (This sentence used to cite `changelog_file` as
# its example; CI-119 deleted that key precisely because it was already reparented in effect —
# ignored where it sat — which made it the one bad illustration of the hazard.)
#
# WHY IT EXISTS: GitHub caps a Release body at **125,000 characters**, and the 0.1.0 run died
# there — after it had already bumped the version, written the CHANGELOG, committed, and pushed the
# tag:
#
#   [github.create_release] Creating release for tag v0.1.0
#   ERROR 422 Client Error: Unprocessable Entity ... /repos/kmbhm1/castiron/releases
#
# The cap is not documented in GitHub's REST reference; it was established by POSTing the oversized
# body as a *draft*, which answered `{"resource":"Release","code":"custom","field":"body",
# "message":"body is too long (maximum is 125000 characters)"}` and created nothing.
#
# This is a FIRST-RELEASE problem specifically. With no prior tag the entire history lands under one
# `## v0.1.0` heading; every later release covers only the commits since the previous tag.
#
# MEASURED against `1197a10` under PSR **9.21.2** (what the `@v9` action resolves to — see the skew
# note below), capturing the literal `release_notes` argument handed to `Github.create_release`:
#
#     nothing set (as it ran)      169,012 chars   -> over by 44,012, reproduces the 422
#     these patterns                87,592 chars   -> 29.9% under the cap
#
# Both rows compute `0.1.0`: exclusions are presentation-only and never change the bump.
#
# `mask_initial_release = true` would also fit (it collapses the whole thing to `- Initial Release`,
# 56 chars) and was REJECTED by captain ruling — Hard Rule #1 says the changelog *is* the commit
# history, so the feat/fix narrative stays and only the non-user-facing types go.
#
# SEMANTICS, read from the shipped 9.21.2 rather than the docs (`changelog/release_history.py`):
#
# * `pattern.match(commit_message)` (:159) — `re.match` anchors at the start and needs only a
#   PREFIX, so `^ci` matches `ci(release): …` as well as `ci: …`. Verified end-to-end: every scoped
#   spelling in this history (`ci(release)`, `docs(reference)`, `refactor(ir)`, `test(emitters)`, …)
#   is present in the unfiltered body and absent from the filtered one.
# * Merge commits never depended on this list. `ignore_merge_commits` (:169) `continue`s before the
#   exclusion filter is consulted — all 24 `Merge pull request …` commits score zero in BOTH bodies.
# * An excluded type that CAUSES A BUMP is deliberately kept (:175 skips only when the commit's
#   bump level is `NO_RELEASE`). Falsified rather than assumed: a synthetic `ci(release): …` with a
#   `BREAKING CHANGE:` footer bumped to 1.0.0 and reappeared under its own heading. These patterns
#   therefore cannot silence the commit that caused the release.
#
# WHY NOTHING LOCAL CAUGHT IT — the same v9/v10 skew as CI-115, on a new key. 9.21.2 defaults
# `mask_initial_release = False` (`cli/config.py`, above a `# TODO: Breaking Change v10` comment);
# the 10.6.1 that `uv.lock` resolves defaults it to `True`, where this could not have happened. Every
# local path (`make check-next-version`, the dev group) runs 10.x, so no local gate can observe a
# v9-only default. Keep this in mind when the action is pinned to v10+ (CI-116) — at that point the
# masking default changes underneath this config.
#
# Guarded by `tests/unit/test_repo_tooling.py`, which asserts these patterns actually name types the
# parser knows: `^chores` would match nothing and leave the fix silently inert.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore",
    "^ci",
    "^build",
    "^style",
    "^test",
    "^docs",
    "^refactor",
]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0
