[project]
# ⚠ The DISTRIBUTION name only. The import package, the console script and the repository stay
# `castiron` -- PyPI carries an admin `ProhibitedProjectName` row for the unhyphenated spelling,
# and its normalization never inserts or removes a separator, so `cast-iron` is a different
# blocklist key. A hyphenated dist over an unhyphenated import is thoroughly idiomatic
# (python-dateutil/dateutil, scikit-learn/sklearn). See NAME-D1.
name = "cast-iron"
version = "0.0.0"
description = "A schema→typed-code compiler for Python — typed models and a typed client from your schema, with drift-check in CI."
authors = [{ name = "Kevin Boehm", email = "kmbhm1@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = [
    "schema",
    "codegen",
    "compiler",
    "pydantic",
    "sqlalchemy",
    "supabase",
    "postgres",
    "openapi",
    "typed",
    "drift",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.7",
    "inflection>=0.5.1",
    "pydantic>=2.13.4",
    # tomllib is stdlib from 3.11; the 3.10 leg needs a parser to read [tool.castiron].
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# ⚠ BUILD-ONLY. This must never become a runtime dependency — castiron's near-zero-runtime-
# dependency posture is deliberate. It cannot leak: extras are opt-in, so `pip install cast-iron`
# does not install this; only `pip install 'cast-iron[build]'` does. Asserted against the built
# wheel's own METADATA by `tests/unit/test_repo_tooling.py` (the marker `; extra == "build"` is
# what makes it inert for a normal install).
#
# It has exactly ONE consumer: `[tool.semantic_release].build_command` below. That command runs
# inside the PSR GitHub Action's own Docker image — `FROM python:3.13-bookworm`, verified at the
# commit `@v9` resolves to (v9.21.2) — which has no `uv` and cannot see the host's, because
# `astral-sh/setup-uv` installs onto the runner, not into the container. So the release build has
# to install its own uv, and this is where that uv's version is declared.
#
# THE PIN TRACKS THE uv THAT WROTE `uv.lock` (0.11.x — `version = 1`, `revision = 3`), not the
# newest uv. The release build is the one place a lock rewrite is COMMITTED and PUBLISHED, so it
# is the one place worth pinning; CI's unpinned `astral-sh/setup-uv` only ever *reads* the lock.
# `>=0.11.32` floors it at the version developers actually run, `==0.11.*` refuses a resolver
# minor nobody has locked against. Measured today: uv 0.12.1 leaves this lock byte-identical, so
# the ceiling costs nothing now — it is insurance against the lock-format `revision` bump uv has
# shipped in minor releases before. Move this pin when the developer toolchain moves.
build = ["uv~=0.11.32"]

[project.urls]
Homepage = "https://github.com/kmbhm1/castiron"
Repository = "https://github.com/kmbhm1/castiron"
Issues = "https://github.com/kmbhm1/castiron/issues"

[project.scripts]
castiron = "castiron.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "vulture>=2.14",
    "python-semantic-release>=9.8.5",
    "pre-commit>=3.7.1",
    "commitizen>=3.28.0",
    # Unconditional in dev so mypy sees real tomli types on the 3.11+ interpreters too:
    # [tool.mypy] pins python_version = "3.10", so mypy always analyses the
    # `import tomli as tomllib` branch of the version gate in castiron/cli/config.py --
    # without tomli installed it would degrade to Any and stop typechecking that module's
    # TOML calls.
    "tomli>=2.0.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.30",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-click>=0.8.1",
    "pymdown-extensions>=10.16.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ⚠ LOAD-BEARING, do not remove. Without this pin hatchling infers the package directory from
# [project].name -- which is `cast-iron` -- looks for `src/cast_iron`, finds nothing, and builds
# an EMPTY wheel that passes every other gate in this repo and only surfaces on a user's
# `pip install`.
packages = ["src/castiron"]

# ----------------------------------------------------------------------------
# House style — ruff (single quotes, 120 cols, Google docstrings, py310 target)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
extend-exclude = ["docs", "dist", "build", ".venv"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP", # pyupgrade
    "D",  # pydocstyle
    "I",  # isort
    "Q",  # flake8-quotes
    "W",  # pycodestyle warnings
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"] # tests need no docstrings

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ----------------------------------------------------------------------------
# Typing is the contract — mypy strict over src/
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
files = ["src"]

# ----------------------------------------------------------------------------
# Tests + coverage (90% floor, enforced in CI on the 3.10–3.13 matrix)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
log_level = "INFO"
markers = [
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test (needs a live source)",
]

[tool.coverage.run]
source = ["src/castiron"]
omit = ["*/__init__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 90

# ----------------------------------------------------------------------------
# Releases are machine-owned — python-semantic-release drives the version bump,
# CHANGELOG, tag, and GitHub Release from Conventional Commit messages.
# NEVER hand-edit the version above or CHANGELOG.md.
# ----------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
allow_zero_version = true
major_on_zero = true
# ⚠ This runs in the PSR action's Docker image, NOT on the runner — `runs: {using: docker, image:
# Dockerfile}`, `FROM python:3.13-bookworm`. It has no `uv`, and the `uv` that
# `astral-sh/setup-uv` put on the runner is not mounted in. The former one-liner `uv build` was
# therefore `uv: command not found`, and PSR aborts the release on a failed build. It also left
# `uv.lock` — which pins `cast-iron` by version — stale inside the very commit that rewrites
# `[project].version`. Both are the shape python-semantic-release documents against itself in
# `configuration-guides/uv_integration.rst`; this is that recipe, with two deliberate deviations
# recorded below.
#
# `set -e` — NOT decoration, and NOT in the vendor's example. PSR runs this whole block as a
# single `sh -c` string (`shell()`, `cli/commands/version.py`), so without it only the LAST
# command's exit status is reported: a failed `uv lock` followed by a successful `uv build` would
# exit 0 and publish the stale lock this command exists to prevent — silently.
#
# `cast-iron` is spelled out where the vendor writes `"$PACKAGE_NAME"`. That variable does not
# exist in the PSR major this repo runs: v9 injects `NEW_VERSION` only (verified at v9.21.2,
# `version.py:638`; `PACKAGE_NAME` arrived in v10). Under v9 it would expand to empty and
# `uv lock --upgrade-package ""` is a hard error — swapping one guaranteed release failure for
# another. `tests/unit/test_repo_tooling.py` binds this literal to `[project].name` and allows
# `$PACKAGE_NAME` again the moment the action is pinned at v10+.
#
# `git add uv.lock` stages into the index PSR then commits with a bare `git commit -m` (no
# pathspec, `gitproject.py`), so the refreshed lock rides the version-bump commit. The action
# sets `safe.directory "*"` in the SYSTEM gitconfig, so this `git` call is not blocked by the
# container's root-vs-runner ownership mismatch.
build_command = """
    set -e
    python -m pip install -e '.[build]'
    uv lock --upgrade-package cast-iron
    git add uv.lock
    uv build
"""
# `conventional` is the current spelling; `angular` is deprecated and removed in PSR v11. Renamed
# only because equivalence was MEASURED on this exact history, not assumed: under both the PSR
# the action runs (9.21.2) and the PSR `uv.lock` resolves (10.6.1), both spellings print `0.1.0`
# and generate a byte-identical 2437-line CHANGELOG. That mattered — `major_on_zero = true` with
# `allow_zero_version = true` means a misparse cuts 1.0.0 instead of 0.1.0.
commit_parser = "conventional"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
# `src/castiron/__init__.py:__version__` is an independent literal, and it is what
# `castiron --version` prints and what the outbound PostgREST User-Agent carries. Without this
# line the first release would leave both reporting 0.0.0 against a published 0.1.0.
version_variables = ["src/castiron/__init__.py:__version__"]
changelog_file = "CHANGELOG.md"

# ⚠ Three v7-era keys were removed here: `branch = "main"`, `upload_to_pypi = false`,
# `upload_to_release = true`. All three were DEAD — `RawConfig` declares no `model_config`, so
# pydantic's default `extra="ignore"` swallowed them without a word (grep for `upload_to_pypi`
# across PSR v9.21.2 and v10.6.1: zero hits; the only `branch` field is the `branches` table
# below). `upload_to_pypi = false` is the reason they are gone rather than merely stale: it READS
# like "this project does not publish to PyPI" and did not disable anything — the publish is the
# explicit `pypa/gh-action-pypi-publish` step in `.github/workflows/release.yml`. An inert key
# that reads load-bearing is the CI-093 / CI-097 trap. The live successor of `upload_to_release`
# is `[tool.semantic_release.publish].upload_to_vcs_release`, which already defaults to `true`,
# so removing it changes nothing. Guarded by `tests/unit/test_repo_tooling.py`.

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0
