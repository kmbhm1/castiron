[project]
name = "castiron"
version = "0.0.0"
description = "A schema→typed-code compiler for Python — typed models and a typed client from your schema, with drift-check in CI."
authors = [{ name = "Kevin Boehm", email = "kmbhm1@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = [
    "schema",
    "codegen",
    "compiler",
    "pydantic",
    "sqlalchemy",
    "supabase",
    "postgres",
    "openapi",
    "typed",
    "drift",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.7",
    "inflection>=0.5.1",
    "pydantic>=2.13.4",
    # tomllib is stdlib from 3.11; the 3.10 leg needs a parser to read [tool.castiron].
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/kmbhm1/castiron"
Repository = "https://github.com/kmbhm1/castiron"
Issues = "https://github.com/kmbhm1/castiron/issues"

[project.scripts]
castiron = "castiron.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "vulture>=2.14",
    "python-semantic-release>=9.8.5",
    "pre-commit>=3.7.1",
    "commitizen>=3.28.0",
    # Unconditional in dev so mypy sees real tomli types on every interpreter: at
    # python_version = "3.10" it analyses the `import tomli as tomllib` branch.
    "tomli>=2.0.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.30",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-click>=0.8.1",
    "pymdown-extensions>=10.16.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/castiron"]

# ----------------------------------------------------------------------------
# House style — ruff (single quotes, 120 cols, Google docstrings, py310 target)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
extend-exclude = ["docs", "dist", "build", ".venv"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP", # pyupgrade
    "D",  # pydocstyle
    "I",  # isort
    "Q",  # flake8-quotes
    "W",  # pycodestyle warnings
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"] # tests need no docstrings

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ----------------------------------------------------------------------------
# Typing is the contract — mypy strict over src/
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
files = ["src"]

# ----------------------------------------------------------------------------
# Tests + coverage (90% floor, enforced in CI on the 3.10–3.13 matrix)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
log_level = "INFO"
markers = [
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test (needs a live source)",
]

[tool.coverage.run]
source = ["src/castiron"]
omit = ["*/__init__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 90

# ----------------------------------------------------------------------------
# Releases are machine-owned — python-semantic-release drives the version bump,
# CHANGELOG, tag, and GitHub Release from Conventional Commit messages.
# NEVER hand-edit the version above or CHANGELOG.md.
# ----------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
allow_zero_version = true
major_on_zero = true
branch = "main"
build_command = "uv build"
commit_parser = "angular"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
changelog_file = "CHANGELOG.md"
upload_to_pypi = false
upload_to_release = true

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0
